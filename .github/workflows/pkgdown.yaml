# name: pkgdown.yaml
# version: 2.0.0
# Description: Builds and deploys the pkgdown site. Pushes to main (or dev)
#   update the development site at /dev, published releases update the main
#   site at /, and pull requests get previews at /pr-preview/<number>.
name: pkgdown
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Releases (published from a version tag) build the main site; everything
      # else builds the development site. pkgdown reads this env var and
      # overrides the mode in `_pkgdown.yml`.
      - name: Set pkgdown dev mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "PKGDOWN_DEV_MODE=release" >> $GITHUB_ENV
          else
            echo "PKGDOWN_DEV_MODE=devel" >> $GITHUB_ENV
          fi

      # The rendered slides are committed in pkgdown/assets/, so no
      # gsm.utils::build_assets() step is needed here. Re-render them locally
      # when pkgdown/menus/slides/*.qmd changes.
      - name: Build site
        if: github.event_name == 'pull_request'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy PR preview 🧪
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/dev
          destination-dir: pr-preview/${{ github.event.number }}
          clean: true

      - name: Comment PR with preview link
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          url="https://stbl.wrangle.zone/pr-preview/${{ github.event.number }}/"
          gh pr comment ${{ github.event.number }} --body "📃 pkgdown preview: $url"

      - name: Deploy to gh-pages 📃
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'

  clean-pr-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove PR preview
        shell: bash
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git rm -r --ignore-unmatch --quiet "pr-preview/${{ github.event.number }}"
          git commit --allow-empty -m "Remove pkgdown preview for PR #${{ github.event.number }}"
          git push
