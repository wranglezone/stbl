# name: pkgdown.yaml
# version: 2.0.1
# Description: Builds and deploys the pkgdown site. Pushes to main (or dev)
#   update the development site at /dev, published releases update the main
#   site at /, and pull requests get previews at /pr-preview/<number>.
name: pkgdown
on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/api2r/pkgskills-ci:release
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      # The container image doesn't include Quarto, which build_assets()
      # needs to render the slides.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        uses: api2r/actions/install@v1
        with:
          use-container: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          needs: website
          extra-packages: any::pkgdown gilead-public/gsm.utils@*release local::.

      # Releases (published from a version tag) build the main site; everything
      # else builds the development site. pkgdown reads this env var and
      # overrides the mode in `_pkgdown.yml`.
      - name: Set pkgdown dev mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "PKGDOWN_DEV_MODE=release" >> $GITHUB_ENV
          else
            echo "PKGDOWN_DEV_MODE=devel" >> $GITHUB_ENV
          fi

      # Render slides (etc.) from pkgdown/menus/ so the deployed assets always
      # match the latest sources, even if they weren't rebuilt locally.
      - name: Build pkgdown assets
        shell: Rscript {0}
        run: gsm.utils::build_assets()

      - name: Build site
        if: github.event_name == 'pull_request'
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy PR preview 🧪
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: docs/dev
          target-folder: pr-preview/${{ github.event.number }}
          # Only update the target folder; never clean the whole branch.
          clean: false

      # Update the existing preview comment (matched via an invisible marker)
      # instead of adding a new comment on every push.
      - name: Comment PR with preview link
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- pkgdown-preview-url -->';
            const url = `https://stbl.wrangle.zone/pr-preview/${context.issue.number}/`;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const body = `${marker}\n🌐 pkgdown preview: ${url}\n\n_Deployed by [this GitHub Action](${runUrl}). Updated: ${timestamp}_`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Deploy to gh-pages 📃
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'

  clean-pr-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove PR preview
        shell: bash
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git rm -r --ignore-unmatch --quiet "pr-preview/${{ github.event.number }}"
          git commit --allow-empty -m "Remove pkgdown preview for PR #${{ github.event.number }}"
          git push
